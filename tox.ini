[tox]
envlist = python3.11,python3.12,python3.13,python3.14,python3.15,extra

[gh-actions]
python =
    3.11: python3.11
    3.12: python3.12
    3.13: python3.13
    3.14: python3.14
    3.15: python3.15

[testenv]
base_python =
    python3.11: python3.11
    python3.12: python3.12
    python3.13: python3.13
    python3.14: python3.14
    python3.15: python3.15
groups = dev
pass_env = PDM_CONFIG_FILE
commands_pre=
    pip install pandas
commands=
    pytest -s -vv {posargs} {toxinidir}/tests/

[testenv:extra]
changedir={toxinidir}/tests/
setenv=
    TERM=linux
    TERMINFO=/etc/terminfo
commands=
    ptpython interactive_test.py --interactive
    bpython -i interactive_test.py
    ipython interactive_test.py
